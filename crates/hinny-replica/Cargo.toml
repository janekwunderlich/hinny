[package]
name = "hinny-replica"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A read-only copy of a hinny-server's namespaces, kept current over HTTP, queried locally"
publish = false

[lib]
name = "hinny_replica"

[dependencies]
hinny = { path = "../hinny" }
serde_json = "=1.0.149"
# Blocking, and TLS through rustls (a primary behind a proxy that terminates TLS); no gzip: the
# files are compressed already where it pays.
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"] }
