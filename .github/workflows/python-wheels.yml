# Builds the Python package: abi3 wheels (one per platform serves Python 3.11 and later) for macOS
# on Apple silicon and Intel, and Linux (manylinux 2.28) on x86_64 and aarch64; and the source
# distribution. Tests the wheels on the oldest and newest supported Pythons where a runner can run
# them, checks that the sdist builds and passes on Linux, and keeps everything as one `dist`
# artifact. It doesn't publish; see bindings/python/RELEASING.md.
name: Python wheels

on:
  workflow_dispatch:
  push:
    tags: ["py-v*"]

permissions:
  contents: read

env:
  MATURIN_VERSION: "1.15.0"

jobs:
  macos:
    runs-on: macos-15  # Apple silicon; Intel is cross-compiled
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Rust
        run: rustup update stable && rustup default stable && rustup target add ${{ matrix.target }}
      - name: Build
        working-directory: bindings/python
        run: |
          python -m pip install maturin==$MATURIN_VERSION
          maturin build --target ${{ matrix.target }} --out dist   # the "python" profile from pyproject.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          working-directory: bindings/python
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-${{ matrix.target }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build
        working-directory: bindings/python
        run: python -m pip install maturin==$MATURIN_VERSION && maturin sdist --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: bindings/python/dist/*.tar.gz
          if-no-files-found: error

  test:
    needs: [macos, linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, wheel: wheel-aarch64-apple-darwin, python: "3.11" }
          - { os: macos-15, wheel: wheel-aarch64-apple-darwin, python: "3.x" }
          - { os: ubuntu-latest, wheel: wheel-linux-x86_64, python: "3.11" }
          - { os: ubuntu-latest, wheel: wheel-linux-x86_64, python: "3.x" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.wheel }}
          path: dist
      - name: Test the wheel
        run: |
          python -m pip install dist/*.whl numpy
          cd "$RUNNER_TEMP" && python -m unittest discover -v -s "$GITHUB_WORKSPACE/bindings/python/tests"

  sdist-linux:
    needs: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Rust
        run: rustup update stable && rustup default stable
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Build from the source distribution and test
        run: |
          python -m pip install dist/*.tar.gz numpy
          cd "$RUNNER_TEMP" && python -m unittest discover -v -s "$GITHUB_WORKSPACE/bindings/python/tests"

  dist:
    needs: [test, sdist-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
