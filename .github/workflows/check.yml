# Runs scripts/check.sh: the Rust tests, the fault sweep, the Python bindings and the benchmark
# protocol. Started by hand for now (no Actions minutes this month); to run it on every push,
# add `push:` under `on:`. macOS, since hinny-names is a Mac crate (its runners count 10x minutes).
name: check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rust toolchain
        run: rustup update stable && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Python environment
        run: |
          python -m venv bindings/python/.venv
          bindings/python/.venv/bin/pip install --quiet maturin numpy
      - name: Checks
        run: scripts/check.sh
